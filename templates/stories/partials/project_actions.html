<div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:14px;">
  <button class="btn {% if project.brand_mode == 'blast' %}blast{% else %}beta{% endif %}" type="submit" form="project-edit-form" name="action" value="generate_concept">
    {% if concept %}Gerar novo conceito{% else %}Gerar conceito{% endif %}
  </button>

  {% if concept %}
    <button class="btn secondary" type="submit" form="project-edit-form" name="action" value="generate_images">Aprovar conceito e gerar 2 imagens</button>
  {% endif %}

  <form method="post" style="margin:0;" onsubmit="return confirm('Excluir este projeto?');">
    {% csrf_token %}
    <input type="hidden" name="action" value="delete_project">
    <button class="btn secondary" type="submit">Excluir projeto</button>
  </form>
</div>

{% if project.error_message %}
  <div style="margin-top:14px; color:#d93025;">{{ project.error_message }}</div>
{% endif %}
